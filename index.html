        * {

            padding: 0;

        :root {
            --black: #121212;

            --light-gold: #FFD700;
            --gray: #f7f7f7;
            --text-gray: #555;
            --white: #ffffff;

            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 999;
        }
        .logo-text {
            color: var(--light-gold);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .pc-menu {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        .pc-menu a {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }
        .pc-menu a:hover {
            color: var(--gold);
        }
        .lang-switch-group{
            display:flex;
            gap:8px;
        }
        .lang-btn{
            border:1px solid var(--gold);
            color:var(--gold);
            background:transparent;
            padding:4px 8px;
            cursor:pointer;
        }
        .lang-btn.active{
            background:var(--gold);
            color:var(--black);
        }
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            z-index: 1001;
        }
        .hamburger span {
            width: 26px;
            height: 2px;
            background: #fff;
            display:block;
        }
        .mobile-sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: var(--black);
            padding: 40px 30px;
            transition: right 0.4s ease;
            z-index: 1000;
        }
        .mobile-sidebar.open {
            right: 0;
        }
        .sidebar-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
        }
        .mobile-sidebar a {
            display: block;
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            margin: 22px 0;
        }
        .mobile-sidebar a:hover {
            color: var(--gold);
        }
        .mask {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            z-index: 998;
        }
        .mask.show {
            display: block;
        }
        .banner-box {
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), #222;
            height: 440px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }
        .banner-box h1 {
            color: var(--light-gold);
            font-size: 40px;
            margin-bottom: 18px;
        }
        .banner-desc {
            font-size: 18px;
            max-width: 750px;
            line-height: 1.9;
            margin-bottom: 30px;
        }
        .banner-btn {
            padding: 14px 36px;
            background: var(--gold);
            color: var(--black);
            text-decoration: none;
            font-weight: 600;
            border-radius: 3px;
            transition: 0.3s;
        }
        .banner-btn:hover {
            background: var(--light-gold);
        }
        .section-wrap {
            padding: 70px 5%;
        }
        .section-title {
            text-align: center;
            font-size: 30px;
            color: var(--black);
            margin-bottom: 48px;
        }
        .story-text {
            max-width: 1000px;
            margin: 0 auto 60px;
            text-align: center;
            line-height: 2;
            font-size: 17px;
            color: var(--text-gray);
        }
        .love-series-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 36px;
            margin-bottom: 70px;
        }
        .series-card {
            border: 1px solid #eee;
            padding: 32px;
            border-radius: 10px;
            transition: 0.3s;
        }
        .series-card:hover {
            box-shadow: 0 8px 24px #ddd;
        }
        .series-card h3 {
            color: var(--gold);
            font-size: 22px;
            margin-bottom: 16px;
        }
        .series-card p {
            color: var(--text-gray);
            line-height: 1.8;
        }
        .product-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 32px;
            margin: 60px 0;
        }
        .product-card {
            border: 1px solid #eee;
            padding: 28px;
            border-radius: 8px;
        }
        .product-card h3 {
            color: var(--gold);
            margin-bottom: 14px;
            font-size: 20px;
        }
        .product-card p {
            color: var(--text-gray);
            line-height: 1.7;
        }
        .check-module {
            background: var(--gray);
            padding: 55px 5%;
            text-align: center;
            margin: 50px 0;
        }
        .check-input {
            width: 340px;
            padding: 14px;
            border: 1px solid #ccc;
            font-size: 16px;
            margin-right: 12px;
            border-radius: 2px;
        }
        .check-btn {
            padding: 14px 28px;
            background: var(--black);
            color: var(--light-gold);
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        .check-result{
            max-width:700px;
            margin:30px auto 0;
            padding:25px;
            background:#fff;
            border:1px solid var(--gold);
            text-align:left;
            display:none;
            line-height:2;
        }
        .check-result.show{
            display:block;
        }
        #qrcode-box{
            margin-top:20px;
            text-align:center;
        }
        .check-tip {
            margin-top: 18px;
            color: #666;
        }
        .about-text {
            max-width: 920px;
            margin: 0 auto;
            line-height: 1.9;
            font-size: 16px;
            color: var(--text-gray);
            text-align: center;
        }
        .care-wrap{
            max-width:960px;
            margin:0 auto;
        }
        .care-block{
            background:#f8f8f8;
            padding:24px;
            border-radius:8px;
            margin-bottom:30px;
        }
        .care-block h3{
            color:var(--gold);
            margin-bottom:16px;
            font-size:22px;
        }
        .care-block p,.care-block li{
            line-height:1.8;
            color:var(--text-gray);
            font-size:15px;
        }
        .care-block ul{
            padding-left:22px;
            margin-top:10px;
        }
        footer {
            background: var(--black);
            color: #aaa;
            padding: 36px 5%;
            text-align: center;
            margin-top: 50px;
            line-height:1.8;
        }
        footer .contact-info{
            margin:12px 0;
        }
        @media(max-width: 860px) {
            .pc-menu {
                display: none;
            }
            .hamburger {
                display: flex;
            }
            .check-input {
                width: 80%;
                margin-bottom: 15px;
                margin-right: 0;
            }
            .banner-box h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

        let currentLang = "bm";
        let lastSearchInput = "";
        let gemPopDatabase = [];

        function renderText(lang){
            currentLang = lang;
            document.querySelectorAll("[data-i18n]").forEach(el=>{
                const key = el.getAttribute("data-i18n");
                el.innerHTML = i18nDict[lang][key];
            });
            document.documentElement.lang = lang;
            const careListBox = document.getElementById("careListBox");
            const careList = i18nDict[lang]["warranty.careList"] || [];
            careListBox.innerHTML = "";
            careList.forEach(item=>{
                const li = document.createElement("li");
                li.textContent = item;
                careListBox.appendChild(li);
            });
            if(lastSearchInput){
                searchCert();
            }
        }

        renderText("bm");

        const langBtns = document.querySelectorAll('.lang-btn');
        langBtns.forEach(btn=>{
            if(btn.dataset.lang === currentLang) btn.classList.add('active');
            btn.addEventListener('click',function(){
                langBtns.forEach(b=>b.classList.remove('active'));
                this.classList.add('active');
                const targetLang = this.getAttribute('data-lang');
                renderText(targetLang);
            });
        });

        const openBtn = document.getElementById('openMenu');
        const closeBtn = document.getElementById('closeMenu');
        const sideBar = document.getElementById('sideBar');
        const mask = document.getElementById('maskLayer');
        function closeSide(){
            sideBar.classList.remove('open');
            mask.classList.remove('show');
            document.body.style.overflow = '';
        }
        openBtn.addEventListener('click', function(e){
            e.stopPropagation();
            sideBar.classList.add('open');
            mask.classList.add('show');
            document.body.style.overflow = 'hidden';
        });
        closeBtn.addEventListener('click', closeSide);
        mask.addEventListener('click', closeSide);
        const navLinks = sideBar.querySelectorAll('a');
        navLinks.forEach(item => {
            item.addEventListener('click', closeSide);
        });

        // 接口请求：关闭压缩，读取Worker接口
        fetch("/data.json", {
            cache: "no-cache",
            headers: {
                "Accept-Encoding": "identity"
            }
        })
        .then(res => {
            if (!res.ok) throw new Error("接口异常");
            return res.text();
        })
        .then(rawText => {
            gemPopDatabase = JSON.parse(rawText);
            console.log("数据加载完成，总条数：", gemPopDatabase.length);
        })
        .catch(err => {
            let tip;
            if(currentLang === "cn") tip = "线上数据接口加载失败，请稍后重试";
            else if(currentLang === "bm") tip = "Gagal memuat data talian, sila cuba kemudian";
            else tip = "Failed to load online data, please try again later";
            alert(tip);
            console.error("读取失败：", err);
        });

        const inputEl = document.getElementById('certInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultContent = document.getElementById('resultContent');
        const qrBox = document.getElementById("qrcode-box");

        function searchCert(){
            resultBox.classList.remove('show');
            qrBox.innerHTML = "";
            let inputVal = inputEl.value.trim().toUpperCase();
            lastSearchInput = inputVal;
            if(!inputVal){
                let tip;
                if(currentLang === "bm") tip = "Sila masuk ID sijil atau kod laser";
                else if(currentLang === "cn") tip = "请输入证书编号或钻石腰码";
                else tip = "Please input certificate ID or laser code";
                resultTitle.innerText = tip;
                resultContent.innerText = "";
                resultBox.classList.add('show');
                return;
            }
            // 匹配gpId / Cert-Number 双字段，大小写兼容
            const matchItem = gemPopDatabase.find(item=>{
                const gpId = (item.gpId || "").toUpperCase();
                const certNo = (item["Cert-Number"] || "").toUpperCase();
                return gpId === inputVal || certNo === inputVal;
            });
            if(!matchItem){
                let tip;
                if(currentLang === "bm") tip = "Tiada rekod berlian dijumpai, sila semak ID";
                else if(currentLang === "cn") tip = "未查询到对应钻石档案，请核对编号";
                else tip = "No matching diamond record found, please check ID";
                resultTitle.innerText = tip;
                resultContent.innerText = "";
                resultBox.classList.add('show');
                return;
            }
            // 自动区分宝石类型文案
            let stoneShowName = "";
            if(matchItem.tech === "HPHT" || matchItem.tech === "CVD"){
                stoneShowName = "Lab Grown Diamond 培育钻石";
            }else if(matchItem.tech === "MOISSANITE"){
                stoneShowName = "Moissanite 莫桑石";
            }
            const issueDate = matchItem.issueDate || "--";
            // 生成二维码（当前页面链接+GP编号）
            const qrUrl = window.location.origin + window.location.pathname + "?gp=" + matchItem.gpId;
            QRCode.toCanvas(qrUrl, { width:160 }, function (error, canvas) {
                if (!error) qrBox.appendChild(canvas);
            });
            // 多语言渲染结果
            if(currentLang === "cn"){
                resultTitle.innerText = "✅ 查询匹配成功";
                resultContent.innerHTML = `
GP编号：${matchItem.gpId}<br>
证书编号：${matchItem["Cert-Number"] || "无"}<br>
宝石类型：${stoneShowName}（${matchItem.tech}）<br>
克拉重量：${matchItem.carat}<br>
颜色等级：${matchItem.color}<br>
净度等级：${matchItem.clarity}<br>
切工等级：${matchItem.cut}<br>
证书机构：IGI<br>
发证日期：${issueDate}<br>
下方二维码：分享当前查验页面
                `;
            }else if(currentLang === "bm"){
                resultTitle.innerText = "✅ Padanan Rekod Berjaya";
                resultContent.innerHTML = `
Nombor GP：${matchItem.gpId}<br>
ID Sijil：${matchItem["Cert-Number"] || "Tiada"}<br>
Jenis Batu：${stoneShowName}（${matchItem.tech}）<br>
Berat Karat：${matchItem.carat}<br>
Gred Warna：${matchItem.color}<br>
Gred Kejelasan：${matchItem.clarity}<br>
Gred Potongan：${matchItem.cut}<br>
Pihak Sijil：IGI<br>
Tarikh Keluar：${issueDate}<br>
QR kod di bawah: Kongsi halaman semakan ini
                `;
            }else{
                resultTitle.innerText = "✅ Match Success";
                resultContent.innerHTML = `
GP ID：${matchItem.gpId}<br>
Certificate ID：${matchItem["Cert-Number"] || "None"}<br>
Stone Type：${stoneShowName}（${matchItem.tech}）<br>
Carat Weight：${matchItem.carat}<br>
Color Grade：${matchItem.color}<br>
Clarity Grade：${matchItem.clarity}<br>
Cut Grade：${matchItem.cut}<br>
Cert Authority：IGI<br>
Issue Date：${issueDate}<br>
QR Code below: Share this verify page
                `;
            }
            resultBox.classList.add('show');
        }
        searchBtn.addEventListener('click', searchCert);
        inputEl.addEventListener('keydown',e=>{
            if(e.key === "Enter") searchCert();
        });
    </script>
